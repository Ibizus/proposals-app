name: CI

# Validates every push and pull request to main: format, lint, test and build
# for back/ (Maven) and front/ (Angular), plus a docker compose build smoke test.
# No deployment. No secrets are needed: backend tests use their own in-test
# database configuration. If a later step needs one, read it from
# ${{ secrets.NAME }} and never commit it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Format and lint gates only check files changed since this commit, so
  # legacy code is cleaned up as it is touched.
  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

jobs:
  backend:
    name: Backend (format, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff base
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Format check (Spotless, google-java-format)
        run: ./mvnw -B -ntp spotless:check -Dspotless.ratchetFrom="$DIFF_BASE"

      - name: Lint (Checkstyle)
        run: ./mvnw -B -ntp checkstyle:check

      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: back/target/surefire-reports
          if-no-files-found: ignore

      - name: Build
        run: ./mvnw -B -ntp package -DskipTests

  frontend:
    name: Frontend (format, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve diff base
        run: |
          base="$BASE_SHA"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "DIFF_BASE=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Format check (Prettier, changed files)
        run: |
          mapfile -t files < <(git diff --name-only --relative --diff-filter=ACMR "$DIFF_BASE" HEAD)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed frontend files."
            exit 0
          fi
          npx prettier --check --ignore-unknown "${files[@]}"

      - name: Lint (ESLint, changed files)
        run: |
          mapfile -t files < <(git diff --name-only --relative --diff-filter=ACMR "$DIFF_BASE" HEAD -- 'src/*.ts' 'src/*.html')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed frontend sources."
            exit 0
          fi
          npx eslint --max-warnings=0 "${files[@]}"

      - name: Test (headless Chrome, coverage)
        # Non-blocking until the frontend test suite lands: the existing
        # scaffolded specs fail for missing providers. Remove this line then.
        continue-on-error: true
        run: npm run test:ci

      - name: Coverage report (warn below 60% lines)
        if: always()
        run: |
          summary=coverage/front/coverage-summary.json
          if [ ! -f "$summary" ]; then
            echo "::warning title=Frontend coverage::No coverage summary was produced."
            exit 0
          fi
          pct="$(node -p "require('./$summary').total.lines.pct")"
          echo "Frontend line coverage: ${pct}%" | tee -a "$GITHUB_STEP_SUMMARY"
          if node -e "process.exit(Number('$pct') < 60 ? 0 : 1)"; then
            echo "::warning title=Frontend coverage::Line coverage ${pct}% is below the 60% target."
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: front/coverage/front
          if-no-files-found: ignore

      - name: Build (production)
        run: npx ng build --configuration production

  docker:
    name: Docker Compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build
