<button pButton icon="pi pi-envelope" 
  pTooltip="{{ 'SEND PROPOSAL' | translate }}"
  class="bg-[#0056D2] py-2 px-4 text-white hover:bg-[#200A58]"
  (click)="showDialog()">
</button>

<div class="card flex flex-column align-items-center gap-2">
    <p-dialog 
        header="Email" 
        [(visible)]="visible" 
        [style]="{ width: '50vw' }"
        [modal]="true"
        [draggable]="false"
        [resizable]="false"
    >
    <div class="grid grid-cols-1 gap-4">
        <!-- Email -->
        <div class="flex flex-col">
          <label class="text-gray-700 font-semibold text-left">To</label>
          <input pInputText [(ngModel)]="emailInput" [placeholder]=emailPlaceholder class="input-field" type="text" required />
        </div>
        <!-- Subject -->
        <div class="flex flex-col">
          <label class="text-gray-700 font-semibold text-left">Subject</label>
          <input pInputText [(ngModel)]="subjectInput" class="input-field" type="text" required />
        </div>
        <!-- Body -->
        <div class="flex flex-col">
          <label class="text-gray-700 font-semibold text-left">Message</label>
          <textarea pInputTextarea [(ngModel)]="messageInput" class="input-field" type="text" required></textarea>
        </div>
        <button class="bg-[#0056D2] text-white py-2 px-4 rounded-md mx-auto block mt-8 col-span-full"
          (click)="sendEmail()" type="button">
          <label>Send Proposal</label>
        </button>
      </div>
    </p-dialog>
</div>
