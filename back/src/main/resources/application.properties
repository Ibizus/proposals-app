#mysql localhost
spring.application.name=back
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/proposals_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Tiempo máximo (en ms) que Hikari esperará una conexión válida antes de lanzar excepción
spring.datasource.hikari.connection-timeout=30000
# Permite que la aplicación arranque aunque la DB no esté lista al primer intento
spring.datasource.hikari.initialization-fail-timeout=-1

#jpa
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
# Bean Validation runs on REST request bodies (@Valid), not on JPA lifecycle events.
spring.jpa.properties.jakarta.persistence.validation.mode=none

#jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.date-format=yyyy-MM-dd
#formatting
spring.jpa.properties.hibernate.format_sql=true

#MAIL CONFIGURATION
# Defaults point at Mailpit (see docker-compose.yml), the zero-secret local SMTP
# server used for development, so a fresh checkout sends mail with no .env and no
# secrets. Every value can be overridden through environment variables; the Resend
# real-sending setup is documented in README.md (Mail section).
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
# From address of every outgoing message.
app.mail.from=${APP_MAIL_FROM:demo@propflow.local}

# Other properties (MAIL CONFIGURATION)
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# STARTTLS for port 587 providers such as Resend. Mailpit on port 1025 accepts
# plaintext SMTP, and JavaMail simply does not negotiate STARTTLS there.
spring.mail.properties.mail.smtp.starttls.enable=true

# SSL, post 465
#spring.mail.properties.mail.smtp.socketFactory.port = 465
#spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

# Demo data: seed.DemoDataSeeder fills empty tables with fictitious data only when
# this is true. The dev profile (application-dev.properties, used by ./dev.sh and
# docker-compose.yml) enables it.
app.seed-demo-data=false

# File Uploads / Attachments Path
app.attach-path=${APP_ATTACH_PATH:uploads/}

# Mail templates render message keys from the messages_*.properties bundles below,
# which are saved as UTF-8 (accents, €, em dashes); decode them as UTF-8.
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Actuator / Micrometer: expose only the safe observability endpoints. Sensitive
# endpoints (env, configprops, shutdown, heapdump, ...) stay closed by not being exposed.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
# The mail health indicator connects to the SMTP server, so a missing local
# Mailpit would otherwise take /actuator/health DOWN. It is off by default and
# can be enabled for deployments where SMTP health should be reported.
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
# Spring Boot disables the env info contributor by default; enable it so the
# info.app.* properties below are published at /actuator/info.
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Proposals backend API
info.app.version=@project.version@
