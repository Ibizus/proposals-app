#mysql localhost
spring.application.name=back
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/proposals_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Tiempo máximo (en ms) que Hikari esperará una conexión válida antes de lanzar excepción
spring.datasource.hikari.connection-timeout=30000
# Permite que la aplicación arranque aunque la DB no esté lista al primer intento
spring.datasource.hikari.initialization-fail-timeout=-1

#jpa
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update

#jackson
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.date-format=yyyy-MM-dd
#formatting
spring.jpa.properties.hibernate.format_sql=true

#GMAIL CONFIGURATION:
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

# Other properties (MAIL CONFIGURATION)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# TLS , port 587
spring.mail.properties.mail.smtp.starttls.enable=true

# SSL, post 465
#spring.mail.properties.mail.smtp.socketFactory.port = 465
#spring.mail.properties.mail.smtp.socketFactory.class = javax.net.ssl.SSLSocketFactory

# File Uploads / Attachments Path
app.attach-path=${APP_ATTACH_PATH:uploads/}

#Add support to render special characters
spring.messages.encoding=ISO-8859-1
