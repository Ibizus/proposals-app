<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <style>
    .container{
        max-width: 640px;
        margin: 0 auto;
        background-color: #fff;}
    body{
        color: #000;
        background-color: #D2D2D2;}
    .message{
        padding: 40px;
    }
    p, p, div , h4, h1{
        margin:0cm;
        font-family:"Capbri",sans-serif;}
    p, p, div{            
        font-size:11.0pt;}
    a:link, a:visited {
        color:#0056D2;}
    .sublist {
        list-style-type: lower-latin;
        margin-top: 0.2em;
        margin-bottom: 0.2em;
    }
  </style>
</head>
<body>
    <header class="container">
        <img id="imgbanner" src=cid:banner.png alt="banner">
    </header>
    <main class="container">
        <section class="message">
            <p th:text="${greeting}">Dear [Recipient's Name],</p>
            <br>
            <p th:text="${introduction}">Introduction</p>
            <br>
            <p th:utext="${contractType}">Contract</p>
            <p th:utext="${startDate}">Start date</p>
            <p th:utext="${grossSalary}">Salary</p>
            <p th:utext="${monthlyBase}">Base salary</p>
            <p th:utext="${monthlyIH}">IHT</p>
            <p th:utext="${foodAllowance}">Food allowance</p>
            <p th:utext="${socialBenefits}">Social benefits</p>
            <p th:utext="${healthInsurance}">Health Insurance</p>
            <p th:utext="${pfeInsurance}">pfe Insurance</p>
            <p th:utext="${carAllowance}">Car Allowance</p>
            <p th:utext="${fuelAllowance}">Fuel Card</p>
            <p th:utext="${phone}">Phone</p>
            <p th:utext="${laptop}">Computer</p>
            <p th:utext="${spp}">SPP & PPP</p>
            <p th:utext="${flex}">Flex</p>
        </section>
    </main>
</body>
</html>
