greeting=Hello {candidate},
intro=Following our conversation, we hereby present the proposed conditions for your admission to {office}:
contractType=Contract Type: {contract} contract, with a 180-day probationary period as per legal terms.
startDate=Date of Admission: {date}.
grossSalary=Monthly Remuneration: {monthlyGross} gross monthly ({yearlyGross} gross anually), composed of the following components:
monthlyBase=Monthly Base Remuneration: €{base} gross, payable in fourteen monthly installments, subject to applicable legal deductions. 
monthlyIHT=Compensation for Monthly Work Schedule Exemption: {iht}€ gross, payable in fourteen monthly installments, subject to applicable legal deductions.
foodAllowance=Meal Allowance corresponding to {food} for each effective workday, paid according to the company's current policy.
socialBenefits=Supplementary Social Benefits:
healthInsurance=Health Insurance: Extendable free of charge to 3 family members—spouse or equivalent (under 65 years old) and children (under 25 years old)—as defined by internal regulations in force at the company.
lifeInsurance=Life Insurance and Personal Accident Insurance, as per terms and conditions defined by internal regulations in force at the company.
carAllowance=Car Allowance of €{carMonthly} gross per month, payable in fourteen monthly installments, subject to applicable legal deductions. This amount begins to be paid in month N+1 and corresponds to €{carAnually} gross annually.
fuelAllowance=Fuel Card: Galp Fleet—annual limit of €{fuelAnually} net, equivalent to €{fuelMonthly} net per month. The amount is renewed annually and must be used within the corresponding year; it cannot be carried over to the next year.
phone=Mobile Phone and Vodafone SIM card with internet allowance.
laptop=Laptop computer with Microsoft license and every software needed.
spp=Corporate Programs: Eligible for "SPP - Share Purchase Plan" and "PPP - Profit Participation Plan" of up to 3%.
flex=Flex Program: 1% of salary added to the Flex program, corresponding to €{yearlyFlex} annually.