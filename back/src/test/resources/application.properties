# Test configuration: shadows src/main/resources/application.properties so tests
# run without MySQL, SMTP or jsreport.
spring.application.name=back

# Do not run the startup CommandLineRunners: the demo-data seeder
# (seed.DemoDataSeeder) and the PDF folder reset in BackApplication.
app.seed-demo-data=false
app.reset-pdf-folder=false

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Fail fast if the H2 schema cannot be created from the entities.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.date-format=yyyy-MM-dd

# Mail sender bean needs a host; nothing connects to it during tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test

app.attach-path=target/test-uploads/
app.ATTACH_PATH=target/test-uploads/

spring.messages.encoding=ISO-8859-1
