# Test configuration: shadows src/main/resources/application.properties so tests
# run without MySQL or SMTP.
spring.application.name=back

# Do not run the demo-data seeder (seed.DemoDataSeeder) at startup.
app.seed-demo-data=false

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
# Fail fast if the H2 schema cannot be created from the entities.
spring.jpa.properties.hibernate.hbm2ddl.halt_on_error=true
# Same as main: Bean Validation only at the REST boundary.
spring.jpa.properties.jakarta.persistence.validation.mode=none

spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.date-format=yyyy-MM-dd

# Mail sender bean needs a host; nothing connects to it during tests.
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@example.com
spring.mail.password=test
app.mail.from=test@example.com

app.attach-path=target/test-uploads/

# No SMTP server runs during tests; do not let the mail health indicator fail them.
management.health.mail.enabled=false

spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
