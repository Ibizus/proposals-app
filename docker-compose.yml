services:
  mysql:
    image: mysql:8.0
    container_name: proposals_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: user
      MYSQL_DATABASE: proposals_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # TCP (not the socket) so the temporary server MySQL runs while initializing a
      # fresh volume, which has networking disabled, does not count as healthy.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    container_name: proposals_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI and HTTP API

  backend:
    build: ./back
    container_name: proposals_backend
    depends_on:
      mysql:
        condition: service_healthy # Espera activamente a que MySQL acepte conexiones
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/proposals_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: user
      SPRING_PROFILES_ACTIVE: dev
      # The backend runs in its own container, so Mailpit is reached by service
      # name rather than localhost. No SMTP credentials are needed.
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025

  frontend:
    build: ./front
    container_name: proposals_frontend
    depends_on:
      - backend
    ports:
      - "4200:4200"

volumes:
  mysql_data: